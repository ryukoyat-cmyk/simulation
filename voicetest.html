<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>학부모 음성 오디션</title>
<style>
body{font-family:system-ui,"Apple SD Gothic Neo",sans-serif;max-width:1040px;margin:24px auto;padding:0 16px;color:#17233a;line-height:1.5}
table{border-collapse:collapse;width:100%}th,td{border:1px solid #d8e3e6;padding:8px;text-align:center;vertical-align:middle}th{background:#f2f7f8}
button{padding:6px 12px;cursor:pointer}select{padding:5px}textarea{width:100%;min-height:64px;font:inherit}
small,.hint{color:#65718a}.row{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:8px 0}
#status{font-weight:700;margin:12px 0;word-break:break-all}pre{background:#f6f8fa;padding:10px;white-space:pre-wrap;border-radius:8px;font-size:.85rem}
.type{font-weight:700;text-align:left}.def{color:#246b7a;font-weight:700}
</style></head>
<body>
<h1>학부모 음성 오디션</h1>
<p class="hint">유형마다 다른 음성과 연기 지시를 씁니다. 시뮬레이션은 서버의 <b>TTS_PROVIDER</b>(기본 OpenAI) 한 공급자만 쓰므로, 같은 공급자를 골라 들어 보세요. 같은 문장을 유형별로 들어 보고, 마음에 드는 음성 이름을 정해 알려 주세요. 서버에 <b>GEMINI_API_KEY</b>가 없으면 OpenAI 음성으로 재생되고 결과 줄에 provider=openai로 표시됩니다.</p>
<div class="row"><label>성별 <label><input type="radio" name="g" value="female" checked> 여성</label> <label><input type="radio" name="g" value="male"> 남성</label></label>
<label>강도(tone) <select id="tone"><option value="softened">softened (누그러짐)</option><option value="steady" selected>steady (기본)</option><option value="tense">tense (날이 섬)</option><option value="heated">heated (격해짐)</option></select></label>
<label>공급자 <select id="provider"><option value="openai" selected>OpenAI (시뮬레이션 기본)</option><option value="gemini">Gemini</option></select></label>
<label>지시문 <select id="variant"><option value="rich" selected>새 유형별 지시(운영)</option><option value="legacy">예전 한 줄 지시(비교용)</option></select></label></div>
<p>대사<br><textarea id="text">선생님, 오늘 아이가 학교에서 있었던 일을 들었는데요. 정확히 무슨 일이 있었는지 지금 바로 설명해 주세요.</textarea></p>
<table id="grid"><thead><tr><th>유형</th><th>현재 배정 음성</th><th>다른 음성으로 들어 보기</th></tr></thead><tbody></tbody></table>
<p id="status"></p>
<details><summary>서버가 실제로 보낸 지시문 보기</summary><pre id="prompt">(재생하면 여기에 표시됩니다)</pre></details>
<script>
const TYPES=[["cooperative","협력형"],["anxious","걱정형"],["avoidant","회피형"],["demanding","요구형"],["pressure","압박형"]];
const $=id=>document.getElementById(id), tb=document.querySelector("#grid tbody"), audio=new Audio();
let cfg=null;
const gender=()=>document.querySelector("input[name=g]:checked").value;
async function post(o){const r=await fetch("/api/speak",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)});const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);return d}
function render(){
  if(!cfg)return; const g=gender(); tb.innerHTML="";
  for(const [id,label] of TYPES){
    const tr=document.createElement("tr");
    const list=$("provider").value==="gemini"?cfg.choices[g]:["coral","shimmer","sage","nova","alloy","ash","ballad","onyx","echo","verse","fable"];const opts=list.map(v=>`<option>${v}</option>`).join("");
    tr.innerHTML=`<td class="type">${label}</td><td><span class="def">${$("provider").value==="gemini"?cfg.gemini[g][id]:cfg.openai[g][id]}</span><br><button data-t="${id}">▶ 현재 배정</button></td><td><select data-s="${id}">${opts}</select> <button data-t="${id}" data-pick="1">▶ 이 음성</button></td>`;
    tb.appendChild(tr);
  }
}
document.querySelectorAll("input[name=g]").forEach(e=>e.onchange=render); $("provider").onchange=render;
tb.onclick=async e=>{
  const b=e.target.closest("button"); if(!b)return; const t=b.dataset.t, st=$("status"); st.textContent="합성 중…"; const t0=performance.now();
  const body={text:$("text").value,parentId:t,gender:gender(),tone:$("tone").value,promptVariant:$("variant").value,provider:$("provider").value,debug:true};
  if(b.dataset.pick){body.audition=true;const v=tb.querySelector(`select[data-s=${t}]`).value;if(body.provider==="gemini")body.geminiVoice=v;else body.openaiVoice=v}
  try{const d=await post(body);
    st.textContent=`${t} · ${d.voice||"?"} · provider=${d.provider||"?"}${d.model?" ("+d.model+")":""} · ${((performance.now()-t0)/1000).toFixed(1)}초`+(d.geminiError?` · Gemini 실패 원인: ${d.geminiError}`:"");
    $("prompt").textContent=d.prompt||"";
    audio.src=`data:${d.mime};base64,${d.audio}`;audio.play()}catch(err){st.textContent="실패: "+err.message}
};
post({describe:true}).then(d=>{cfg=d;render();if(!d.geminiConfigured)$("status").textContent="GEMINI_API_KEY가 서버에 설정되어 있지 않습니다(OpenAI 음성으로 재생됩니다)."}).catch(e=>$("status").textContent="설정을 불러오지 못했습니다: "+e.message);
</script></body></html>
